<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1014">
<title>Comunicación</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0E1014; --card:#1A1D23; --ink:#ECEEF2; --muted:#8C93A1; --line:#2A2E36;
  --accent:#4C8DD6; --accent-ink:#FFFFFF; --accent-soft:#1E2E44; --danger:#E06A55;
  --ally:#3FBF84; --neutral:#8C93A1; --build:#E0A23A; --hard:#E06A55; --me:#4C8DD6;
  color-scheme:dark;
  --font:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(96px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:center;gap:8px;margin-bottom:14px}
header.top h1{flex:1;margin:0;font-size:24px;font-weight:750;letter-spacing:-.01em}
.icon-btn{width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:18px}
.tip{background:var(--accent-soft);color:var(--ink);border:1px solid #2C4566;border-radius:14px;padding:14px 16px;margin-bottom:14px;width:100%;text-align:left}
.tip small{display:block;opacity:.75;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-bottom:12px}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:14px;padding-left:12px;border-left:2px solid var(--line)}
.node{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.node .who{flex:1;min-width:0}
.node .name{font-weight:650;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .role{color:var(--muted);font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inf{font-size:12px;font-weight:700;color:var(--muted);flex:none}
.view{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.view button{flex:1;padding:8px 0;border-radius:9px;font-weight:650;color:var(--muted);font-size:15px}
.view button[aria-pressed=true]{background:var(--accent-soft);color:var(--ink)}
.chart{overflow-x:auto;margin:0 -16px;padding:4px 16px 8px}
.org{display:flex;flex-direction:column;align-items:flex-start;gap:22px}
.org .group{min-width:100%;display:flex;justify-content:center}
.org ul{display:flex;justify-content:center;list-style:none;margin:0;padding:18px 0 0;position:relative}
.org > .group > ul{padding-top:0}
.org li{display:flex;flex-direction:column;align-items:center;position:relative;padding:18px 5px 0}
.org > .group > ul > li{padding-top:0}
.org li::before,.org li::after{content:'';position:absolute;top:0;width:50%;height:18px;border-top:2px solid var(--line)}
.org li::before{right:50%}
.org li::after{left:50%;border-left:2px solid var(--line)}
.org li:only-child::before,.org li:only-child::after{border-top:0}
.org li:first-child::before,.org li:last-child::after{border-top:0}
.org li:last-child::before{border-right:2px solid var(--line);border-radius:0 6px 0 0}
.org li:first-child::after{border-radius:6px 0 0 0}
.org li:only-child::after{border-radius:0}
.org > .group > ul > li::before,.org > .group > ul > li::after{display:none}
.org ul ul::before{content:'';position:absolute;top:0;left:50%;height:18px;border-left:2px solid var(--line)}
.card{width:132px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--neutral);border-radius:12px;padding:9px 8px 8px;text-align:center}
.card .name{display:block;font-weight:700;font-size:14px;line-height:1.25}
.card .role{display:block;color:var(--muted);font-size:12px;line-height:1.3;margin-top:3px}
.card .inf{display:block;margin-top:4px}
.card.me{box-shadow:0 0 0 2px var(--accent)}
.solo-l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:6px 0 -12px}
.empty{color:var(--muted);text-align:center;padding:36px 12px}
.legend{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:13px;margin:14px 2px 0}
.legend span{display:flex;align-items:center;gap:6px}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;background:var(--accent);color:#fff;font-size:28px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;padding:12px 0 14px;font-weight:650;color:var(--muted)}
nav.tabs button[aria-selected=true]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.tips li{display:flex;gap:8px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px;margin:6px 0}
.tips{list-style:none;padding:0;margin:0}
.tips textarea{flex:1;border:0;resize:none;background:transparent;padding:4px 0;min-height:28px;overflow:hidden}
.del{color:var(--muted);width:32px;height:32px;border-radius:8px;flex:none;font-size:18px}
.add-row{display:flex;gap:8px;margin-top:10px}
.add-row input{flex:1;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.btn{padding:11px 16px;border-radius:12px;background:var(--accent);color:#fff;font-weight:650}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.hint{color:var(--muted);font-size:14px;margin:0 0 10px}
/* hoja de persona */
.sheet{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:10}
.sheet .wrap{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
label.f{display:block;margin:12px 0 4px;font-size:13px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.in{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
textarea.in{min-height:80px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:15px}
.chips button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.reports button{color:#9CC2F0!important}
.reports{display:flex;flex-wrap:wrap;gap:8px}
.reports button{padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:600}
.log{list-style:none;padding:0;margin:8px 0 0}
.log li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0;display:flex;gap:8px}
.log li div{flex:1;white-space:pre-wrap}
.log time{display:block;color:var(--muted);font-size:13px}
.actions{display:flex;gap:10px;margin-top:28px}
</style>
</head>
<body>
<div class="wrap" id="main">
  <header class="top">
    <h1 id="title">Mapa</h1>
    <button class="icon-btn" id="ai" aria-label="Copiar para IA" title="Copiar para IA" style="width:auto;padding:0 12px;font-size:14px;font-weight:700">IA</button>
    <button class="icon-btn" id="import" aria-label="Subir TXT" title="Subir TXT">⬆</button>
    <input type="file" id="file" accept=".txt,text/plain" hidden>
    <button class="icon-btn" id="export" aria-label="Descargar TXT" title="Descargar TXT">⬇</button>
  </header>

  <section id="tab-map">
    <button class="tip" id="tip"><small>Recordá · tocá para otro</small><span id="tip-text"></span></button>
    <div class="view" id="view"><button data-v="chart" aria-pressed="true">Organigrama</button><button data-v="list" aria-pressed="false">Lista</button></div>
    <div class="chart" id="chart"></div>
    <input class="search" id="q" type="search" placeholder="Buscar nombre, rol o área">
    <ul class="tree" id="tree"></ul>
    <p class="empty" id="empty" hidden>Todavía no hay nadie.<br>Tocá <b>+</b> para agregar a la primera persona.</p>
    <div class="legend" id="legend">
      <span><i class="dot" style="background:var(--ally)"></i>Aliado</span>
      <span><i class="dot" style="background:var(--neutral)"></i>Neutral</span>
      <span><i class="dot" style="background:var(--build)"></i>A construir</span>
      <span><i class="dot" style="background:var(--hard)"></i>Difícil</span>
      <span><i class="dot" style="background:var(--me)"></i>Yo</span>
      <span>★ influencia</span>
    </div>
  </section>

  <section id="tab-tips" hidden>
    <p class="hint">Tus reglas para hablar con la gente. Tocá un texto para editarlo.</p>
    <p class="empty" id="tips-empty" hidden>Todavía no cargaste consejos.</p>
    <ul class="tips" id="tips"></ul>
    <form class="add-row" id="tip-form">
      <input id="tip-new" placeholder="Nuevo consejo" autocomplete="off">
      <button class="btn">Agregar</button>
    </form>
  </section>
</div>

<button class="fab" id="add" aria-label="Agregar persona">+</button>

<nav class="tabs" role="tablist">
  <button role="tab" data-tab="map" aria-selected="true">Mapa</button>
  <button role="tab" data-tab="tips" aria-selected="false">Consejos</button>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="wrap">
    <header class="top">
      <button class="icon-btn" id="back" aria-label="Volver">←</button>
      <h1 id="p-title">Persona</h1>
    </header>
    <label class="f" for="p-name">Nombre</label>
    <input class="in" id="p-name" data-k="name" autocomplete="off">
    <label class="f" for="p-role">Rol</label>
    <input class="in" id="p-role" data-k="role" placeholder="Ej: Gerente de Ingeniería">
    <label class="f" for="p-area">Área</label>
    <input class="in" id="p-area" data-k="area" placeholder="Ej: Producción">
    <label class="f" for="p-boss">Responde a</label>
    <select class="in" id="p-boss"></select>
    <label class="f">Influencia</label>
    <div class="chips" id="p-inf"></div>
    <label class="f">Relación conmigo</label>
    <div class="chips" id="p-rel"></div>
    <label class="f" for="p-traits">Características</label>
    <textarea class="in" id="p-traits" data-k="traits" placeholder="Cómo es, qué le importa, qué le molesta…"></textarea>
    <label class="f" for="p-how">Cómo comunicarme</label>
    <textarea class="in" id="p-how" data-k="how" placeholder="Ej: directo y con datos, por escrito, 1 a 1…"></textarea>
    <label class="f" id="p-reports-l">Le reportan</label>
    <div class="reports" id="p-reports"></div>
    <label class="f" for="p-log-new">Charlas y notas</label>
    <form class="add-row" id="log-form" style="margin-top:0">
      <input id="p-log-new" placeholder="Qué hablamos / qué aprendí" autocomplete="off">
      <button class="btn">+</button>
    </form>
    <ul class="log" id="p-log"></ul>
    <div class="actions"><button class="btn danger" id="p-del">Borrar persona</button></div>
  </div>
</div>

<script>
const KEY = 'communication-v1';
const INF = [['alta', 'Alta'], ['media', 'Media'], ['baja', 'Baja']];
const REL = [['yo', 'Yo', 'var(--me)'], ['aliado', 'Aliado', 'var(--ally)'], ['neutral', 'Neutral', 'var(--neutral)'], ['construir', 'A construir', 'var(--build)'], ['dificil', 'Difícil', 'var(--hard)']];
const STARS = { alta: '★★★', media: '★★', baja: '★' };
const OLD_DEFAULT_TIPS = ['Preguntá antes de opinar: entendé qué necesita el otro.', 'Repetí con tus palabras lo que entendiste.', 'Llevá datos, no sólo opiniones.', 'Elogios en público, críticas en privado.', 'Cerrá cada charla con próximos pasos claros.', 'Dejá que el otro termine. Hablá después.', 'Respirá antes de hablar y hablá a conciencia.', 'No hables de más: decí lo justo y callate.'];

let db = load();
function load(){
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && d.people && d.tips) {
      if (!d.v) { d.tips = d.tips.filter(t => !OLD_DEFAULT_TIPS.includes(t)); d.v = 2; }   // los consejos los carga el usuario
      return d;
    }
  } catch {}
  return { v: 2, people: [], tips: [] };
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {} }
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const byId = id => db.people.find(p => p.id === id);
const kids = id => db.people.filter(p => p.boss === id).sort((a, b) => a.name.localeCompare(b.name));
const size = id => kids(id).reduce((n, k) => n + size(k), 1);
const roots = () => db.people.filter(p => !p.boss || !byId(p.boss)).sort((a, b) => size(b.id) - size(a.id) || a.name.localeCompare(b.name));
const relColor = r => (REL.find(x => x[0] === r) || REL[1])[2];

/* ---------- pestañas ---------- */
let tab = 'map';
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll('nav.tabs button').forEach(x => x.setAttribute('aria-selected', x === b));
  $('tab-map').hidden = tab !== 'map'; $('tab-tips').hidden = tab !== 'tips';
  $('add').hidden = tab !== 'map'; $('title').textContent = tab === 'map' ? 'Mapa' : 'Consejos';
  render();
});

/* ---------- mapa ---------- */
function nodeHTML(p){
  return `<button class="node" data-id="${p.id}"><i class="dot" style="background:${relColor(p.rel)}"></i>
    <span class="who"><span class="name">${esc(p.name || 'Sin nombre')}</span><span class="role">${esc([p.role, p.area].filter(Boolean).join(' · '))}</span></span>
    <span class="inf">${STARS[p.inf] || ''}</span></button>`;
}
function branch(p, seen){
  if (seen.has(p.id)) return '';
  seen.add(p.id);
  const ch = kids(p.id).map(k => branch(k, seen)).join('');
  return `<li>${nodeHTML(p)}${ch ? `<ul>${ch}</ul>` : ''}</li>`;
}
let view = 'chart';
function cardHTML(p){
  return `<button class="card${p.rel === 'yo' ? ' me' : ''}" data-id="${p.id}" style="border-top-color:${relColor(p.rel)}">
    <span class="name">${esc(p.name || 'Sin nombre')}</span><span class="role">${esc(p.role || '')}</span><span class="inf">${STARS[p.inf] || ''}</span></button>`;
}
function orgBranch(p, seen){
  if (seen.has(p.id)) return ''; seen.add(p.id);
  const ch = kids(p.id).map(k => orgBranch(k, seen)).join('');
  return `<li>${cardHTML(p)}${ch ? `<ul>${ch}</ul>` : ''}</li>`;
}
$('view').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  view = b.dataset.v; $('view').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); renderMap();
};
$('chart').onclick = e => { const n = e.target.closest('.card'); if (n) open(n.dataset.id); };
function renderMap(){
  const q = $('q').value.trim().toLowerCase();
  let html;
  if (q) {
    html = db.people.filter(p => [p.name, p.role, p.area].join(' ').toLowerCase().includes(q))
      .map(p => `<li>${nodeHTML(p)}</li>`).join('');
  } else {
    const seen = new Set();
    html = roots().map(p => branch(p, seen)).join('');
  }
  const chart = view === 'chart' && !q;
  $('chart').hidden = !chart; $('tree').hidden = chart;
  if (chart) {
    const seen = new Set(), rs = roots(), big = rs.filter(p => kids(p.id).length), solo = rs.filter(p => !kids(p.id).length);
    $('chart').innerHTML = '<div class="org">' + big.map(p => `<div class="group"><ul>${orgBranch(p, seen)}</ul></div>`).join('')
      + (solo.length ? (big.length ? '<div class="solo-l">Fuera de la línea</div>' : '') + `<div class="group"><ul style="flex-wrap:wrap;gap:10px 0">${solo.map(p => `<li>${cardHTML(p)}</li>`).join('')}</ul></div>` : '') + '</div>';
  }
  $('tree').innerHTML = html;
  $('empty').hidden = db.people.length > 0;
  $('legend').hidden = db.people.length === 0;
  showTip();
}
$('q').oninput = renderMap;

let tipIdx = Math.floor(Math.random() * 1000);
function showTip(){
  $('tip').hidden = db.tips.length === 0;
  if (db.tips.length) $('tip-text').textContent = db.tips[tipIdx % db.tips.length];
}
$('tip').onclick = () => { tipIdx++; showTip(); };

/* ---------- consejos ---------- */
function renderTips(){
  $('tips').innerHTML = db.tips.map((t, i) => `<li><textarea rows="1" data-i="${i}">${esc(t)}</textarea><button class="del" data-i="${i}" aria-label="Borrar">×</button></li>`).join('');
  $('tips').querySelectorAll('textarea').forEach(grow);
  $('tips-empty').hidden = db.tips.length > 0;
}
function grow(t){ t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
$('tips').oninput = e => { const t = e.target; if (t.dataset.i == null) return; db.tips[t.dataset.i] = t.value; grow(t); save(); };
$('tips').addEventListener('focusout', e => {
  const t = e.target; if (t.tagName !== 'TEXTAREA') return;
  if (!t.value.trim()) { db.tips.splice(+t.dataset.i, 1); save(); renderTips(); }
});
$('tips').onclick = e => {
  const b = e.target.closest('.del'); if (!b) return;
  if (confirm('¿Borrar este consejo?')) { db.tips.splice(+b.dataset.i, 1); save(); renderTips(); }
};
$('tip-form').onsubmit = e => {
  e.preventDefault(); const v = $('tip-new').value.trim(); if (!v) return;
  db.tips.push(v); $('tip-new').value = ''; save(); renderTips();
};

function render(){ tab === 'map' ? renderMap() : renderTips(); }

/* ---------- persona ---------- */
let cur = null;
function descendants(id){
  const out = new Set([id]); let grew = true;
  while (grew) { grew = false; for (const p of db.people) if (p.boss && out.has(p.boss) && !out.has(p.id)) { out.add(p.id); grew = true; } }
  return out;
}
function openPerson(id){
  cur = byId(id); if (!cur) return;
  $('p-title').textContent = cur.name || 'Nueva persona';
  for (const el of document.querySelectorAll('#sheet [data-k]')) el.value = cur[el.dataset.k] || '';
  const bad = descendants(cur.id);
  $('p-boss').innerHTML = '<option value="">— Nadie / no sé —</option>' + db.people
    .filter(p => !bad.has(p.id)).sort((a, b) => a.name.localeCompare(b.name))
    .map(p => `<option value="${p.id}"${p.id === cur.boss ? ' selected' : ''}>${esc(p.name || 'Sin nombre')}${p.role ? ' — ' + esc(p.role) : ''}</option>`).join('');
  chips('p-inf', INF, 'inf'); chips('p-rel', REL, 'rel');
  const ks = kids(cur.id);
  $('p-reports-l').hidden = $('p-reports').hidden = ks.length === 0;
  $('p-reports').innerHTML = ks.map(k => `<button data-id="${k.id}">${esc(k.name || 'Sin nombre')}</button>`).join('');
  renderLog();
  $('sheet').hidden = false; $('sheet').scrollTop = 0;
  if (!cur.name) $('p-name').focus();
}
function chips(box, opts, key){
  $(box).innerHTML = opts.map(([v, l]) => `<button data-v="${v}" aria-pressed="${cur[key] === v}">${l}</button>`).join('');
  $(box).onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    cur[key] = cur[key] === b.dataset.v ? '' : b.dataset.v; save(); chips(box, opts, key);
  };
}
function renderLog(){
  const log = (cur.log || []).slice().reverse();
  $('p-log').innerHTML = log.map(l => `<li><div><time>${esc(new Date(l.t).toLocaleDateString('es', { day: 'numeric', month: 'short', year: 'numeric' }))}</time>${esc(l.text)}</div><button class="del" data-t="${l.t}" aria-label="Borrar">×</button></li>`).join('');
}
$('p-log').onclick = e => {
  const b = e.target.closest('.del'); if (!b) return;
  if (confirm('¿Borrar esta nota?')) { cur.log = cur.log.filter(l => String(l.t) !== b.dataset.t); save(); renderLog(); }
};
$('log-form').onsubmit = e => {
  e.preventDefault(); const v = $('p-log-new').value.trim(); if (!v) return;
  (cur.log ||= []).push({ t: Date.now(), text: v }); $('p-log-new').value = ''; save(); renderLog();
};
document.querySelectorAll('#sheet [data-k]').forEach(el => el.oninput = () => {
  cur[el.dataset.k] = el.value; save();
  if (el.dataset.k === 'name') $('p-title').textContent = el.value || 'Nueva persona';
});
$('p-boss').onchange = e => { cur.boss = e.target.value; save(); };
$('p-reports').onclick = e => { const b = e.target.closest('button'); if (b) openPerson(b.dataset.id); };
function closeSheet(){
  if (cur && !cur.name.trim()) db.people = db.people.filter(p => p !== cur);   // persona vacía: se descarta
  cur = null; save(); $('sheet').hidden = true; render();
}
$('back').onclick = () => history.state?.sheet ? history.back() : closeSheet();
window.addEventListener('popstate', () => { if (!$('sheet').hidden) closeSheet(); });
$('p-del').onclick = () => {
  if (!confirm(`¿Borrar a ${cur.name || 'esta persona'}? Quienes le reportan quedan sin jefe.`)) return;
  const id = cur.id;
  db.people = db.people.filter(p => p.id !== id);
  db.people.forEach(p => { if (p.boss === id) p.boss = cur.boss || ''; });
  cur = null; save(); $('back').click();
};
const open = id => { history.pushState({ sheet: 1 }, ''); openPerson(id); };
$('tree').onclick = e => { const n = e.target.closest('.node'); if (n) open(n.dataset.id); };
$('add').onclick = () => {
  const p = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: '', role: '', area: '', boss: '', inf: '', rel: '', traits: '', how: '', log: [] };
  db.people.push(p); open(p.id);
};

/* ---------- exportar ---------- */
function toText(){
  const L = [], d = new Date();
  L.push('COMUNICACIÓN — ' + d.toLocaleString('es'), '');
  L.push('== MAPA ==');
  const seen = new Set();
  const walk = (p, depth) => {
    if (seen.has(p.id)) return; seen.add(p.id);
    L.push('  '.repeat(depth) + '- ' + (p.name || 'Sin nombre') + (p.role ? ` (${p.role})` : ''));
    kids(p.id).forEach(k => walk(k, depth + 1));
  };
  roots().forEach(p => walk(p, 0));
  L.push('', '== PERSONAS ==');
  db.people.slice().sort((a, b) => a.name.localeCompare(b.name)).forEach(p => {
    L.push('', '# ' + (p.name || 'Sin nombre'));
    const boss = byId(p.boss);
    const rows = [['Rol', p.role], ['Área', p.area], ['Responde a', boss && boss.name],
      ['Influencia', (INF.find(x => x[0] === p.inf) || [])[1]], ['Relación', (REL.find(x => x[0] === p.rel) || [])[1]],
      ['Características', p.traits], ['Cómo comunicarme', p.how]];
    rows.forEach(([k, v]) => { if (v) L.push(`${k}: ${String(v).replace(/\n/g, '\n    ')}`); });
    if (p.log?.length) { L.push('Notas:'); p.log.forEach(l => L.push(`  ${new Date(l.t).toISOString().slice(0, 10)} — ${l.text}`)); }
  });
  L.push('', '== CONSEJOS ==');
  db.tips.forEach(t => L.push('- ' + t));
  return L.join('\n') + '\n';
}
$('export').onclick = async () => {
  const name = `comunicacion-${new Date().toISOString().slice(0, 10)}.txt`, text = toText();
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};

/* ---------- importar ---------- */
const FIELDS = { 'Rol': 'role', 'Área': 'area', 'Responde a': 'boss', 'Influencia': 'inf', 'Relación': 'rel', 'Características': 'traits', 'Cómo comunicarme': 'how' };
const norm = s => String(s || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function parseText(text){
  const people = [], tips = []; let sec = '', cur = null, last = null, inNotes = false;
  for (const raw of text.replace(/\r/g, '').split('\n')) {
    const line = raw.replace(/\s+$/, '');
    const h = line.match(/^==\s*(.+?)\s*==$/);
    if (h) { sec = norm(h[1]); cur = null; continue; }
    if (sec === 'consejos') { const m = line.match(/^\s*-\s+(.+)/); if (m) tips.push(m[1].trim()); continue; }
    if (sec !== 'personas') continue;
    let m = line.match(/^#\s+(.+)/);
    if (m) { cur = { name: m[1].trim(), log: [] }; people.push(cur); last = null; inNotes = false; continue; }
    if (!cur || !line.trim()) continue;
    if (/^Notas:\s*$/.test(line)) { inNotes = true; last = null; continue; }
    if (inNotes && (m = line.match(/^\s+(\d{4}-\d{2}-\d{2}|\d{1,2}\/\d{1,2}\/\d{4})\s*[—-]\s*(.+)/))) {
      const d = m[1].includes('/') ? m[1].split('/').reverse().map(x => x.padStart(2, '0')).join('-') : m[1];
      cur.log.push({ t: Date.parse(d + 'T12:00:00') || Date.now(), text: m[2].trim() }); continue;
    }
    m = line.match(/^([^:]+):\s*(.*)$/);
    if (m && FIELDS[m[1].trim()]) { last = FIELDS[m[1].trim()]; cur[last] = m[2]; inNotes = false; continue; }
    if (last && /^\s/.test(line)) cur[last] += '\n' + line.trim();
  }
  return { people, tips };
}
function importText(text){
  const { people, tips } = parseText(text);
  if (!people.length && !tips.length) { alert('No encontré datos en el archivo. Tiene que tener secciones "== PERSONAS ==" y/o "== CONSEJOS ==".'); return; }
  if (!confirm(`Voy a cargar ${people.length} persona(s) y ${tips.length} consejo(s). Si alguien ya existe con el mismo nombre, se actualiza. ¿Sigo?`)) return;
  const find = n => db.people.find(p => norm(p.name) === norm(n));
  const pick = (list, v) => { const x = list.find(o => norm(o[1]) === norm(v) || o[0] === norm(v)); return x ? x[0] : ''; };
  for (const q of people) {
    let p = find(q.name);
    if (!p) { p = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: q.name, role: '', area: '', boss: '', inf: '', rel: '', traits: '', how: '', log: [] }; db.people.push(p); }
    for (const k of ['role', 'area', 'traits', 'how']) if (q[k] != null) p[k] = q[k];
    if (q.inf != null) p.inf = pick(INF, q.inf);
    if (q.rel != null) p.rel = pick(REL, q.rel);
    p._boss = q.boss;
    for (const l of q.log) if (!(p.log ||= []).some(x => x.text === l.text)) p.log.push(l);
  }
  for (const p of db.people) {
    if (p._boss === undefined) continue;
    const b = p._boss && find(p._boss); delete p._boss;
    p.boss = b && !descendants(p.id).has(b.id) ? b.id : '';
  }
  for (const t of tips) if (!db.tips.includes(t)) db.tips.push(t);
  save(); render(); toast('Datos cargados.');
}
$('import').onclick = () => $('file').click();
$('file').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (f) importText(await f.text()); };

const AI_PROMPT = `Soy Senior Mechanical Engineer y empecé en un trabajo nuevo. Abajo está mi mapa de la empresa: quién responde a quién, rol, influencia, mi relación con cada persona, sus características y mis notas de charlas. También mis reglas de comunicación.
Analizalo y decime:
1. Quiénes tienen más influencia real y por qué.
2. Con quién conviene construir relación primero y cómo.
3. Cómo comunicarme con cada persona clave (concreto).
4. Riesgos o tensiones que ves.
5. Qué información me falta averiguar.

`;
function toast(msg){
  const t = document.createElement('div'); t.textContent = msg;
  t.style.cssText = 'position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:20';
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}
$('ai').onclick = async () => {
  const text = AI_PROMPT + toText();
  try { await navigator.clipboard.writeText(text); toast('Copiado. Pegalo en Claude o ChatGPT.'); }
  catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('Copiado. Pegalo en Claude o ChatGPT.'); }
};

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
render();
</script>
